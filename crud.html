<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D CRUD App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

body {
  background: #0f172a;
}

.app {
  max-width: 500px;
  margin: 20px auto;
  background: #020617;
  border-radius: 20px;
  padding: 15px;
  color: white;
}

.header {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 15px;
  color: #f97316;
}

.crud-box {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
  text-align: center;
}

.crud-item {
  flex: 1;
}

.circle {
  width: 50px;
  height: 50px;
  background: #0ea5e9;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 5px;
  font-weight: bold;
}

.arrow {
  font-size: 18px;
  margin: 5px 0;
}

.crud-label {
  font-size: 12px;
  color: #f97316;
}

.btn {
  background: #f97316;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
  width: 100%;
  margin-bottom: 10px;
}

.search {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-bottom: 10px;
  background: #1e293b;
  color: white;
}

.card {
  background: #1e293b;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 10px;
}

.actions {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
}

.actions button {
  background: none;
  border: none;
  color: #f97316;
  cursor: pointer;
}

.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
}

.hidden {
  display: none;
}

.modal-content {
  background: #020617;
  padding: 20px;
  border-radius: 15px;
  width: 90%;
  max-width: 350px;
}

.modal input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: none;
  background: #1e293b;
  color: white;
}

.create {
  background: #f97316;
  color: white;
}

.cancel {
  background: gray;
  color: white;
}

.delete-box {
  background: #020617;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
}

.delete-actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.yes, .no {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
}

.yes { background: #f97316; color: white; }
.no { background: gray; color: white; }
</style>

<div class="app">
  <div class="header">D CRUD App</div>

  <div class="crud-box">
    <div class="crud-item"><div class="circle">C</div><div class="arrow">↓</div><div class="crud-label">Create</div></div>
    <div class="crud-item"><div class="circle">R</div><div class="arrow">↓</div><div class="crud-label">Read</div></div>
    <div class="crud-item"><div class="circle">U</div><div class="arrow">↓</div><div class="crud-label">Update</div></div>
    <div class="crud-item"><div class="circle">D</div><div class="arrow">↓</div><div class="crud-label">Delete</div></div>
  </div>

  <button class="btn" onclick="openForm()">+ Create Customer</button>
  <input class="search" placeholder="Search..." oninput="renderCustomers()" />

  <div id="customerList"></div>
</div>

<!-- CREATE MODAL -->
<div id="formModal" class="modal hidden">
  <div class="modal-content">
    <h3>Create Customer</h3>

    <input id="first" placeholder="First Name">
    <input id="last" placeholder="Last Name">
    <input id="email" placeholder="Email">
    <input id="phone" placeholder="Phone">

    <button class="create" onclick="addCustomer()">Create</button>
    <button class="cancel" onclick="closeForm()">Cancel</button>
  </div>
</div>

<!-- DELETE MODAL -->
<div id="deleteModal" class="modal hidden">
  <div class="delete-box">
    <h3>Delete Customer</h3>
    <p>Are you sure?</p>

    <div class="delete-actions">
      <button class="yes" onclick="confirmDelete()">Yes</button>
      <button class="no" onclick="closeDelete()">No</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
